<script>
'use strict';
/* ================= 基本 ================= */
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,PI=Math.PI,clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-(1-k)*(1-k),eIn=k=>k*k;
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
const JP='"Hiragino Kaku Gothic StdN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif';
const EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const MAXC=300;
const fmt=n=>Math.round(n).toLocaleString('ja-JP');
let W=0,H=0,DPR=1,U=1,CX=0,CY=0,R=0,SD=0,FAR=0,NEAR=0,SAFE=0;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function todayStr(){const d=new Date();return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`}
let rng=Math.random,baseSeed=0;

/* ================= 絵文字スプライト ================= */
const SPR={};
function spr(ch){
  if(SPR[ch])return SPR[ch];
  const c=document.createElement('canvas');c.width=c.height=160;
  const x=c.getContext('2d');x.font=`128px ${EF}`;x.textAlign='center';x.textBaseline='middle';x.fillText(ch,80,88);return SPR[ch]=c;
}
function drawEmo(ch,x,y,size,rot=0,alpha=1){
  const c=spr(ch),w=size*1.25;ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);if(rot)ctx.rotate(rot);
  ctx.drawImage(c,-w/2,-w/2,w,w);ctx.restore();
}

/* =========================================================
   サウンドエンジン
   ・全SEは「アタック(tick)＋本体(FM bell)＋余韻(reverb/delay)」の3層
   ・フリック音は常に曲のキー(C)のペンタ／コードトーン → 何を押しても曲の一部になる
   ・コンボで音程が上がる（Peggle式）、BGMはコンボで楽器が増える（vertical layering）
   ・キック毎にパッド類をダッキング（ポンピング）、ミス時は曲がこもる（ローパス）
   ========================================================= */
let AC=null,A=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function setP(n,o){for(const k in o)n[k].value=o[k]}
function makeIR(ctx,dur,decay){
  const sr=ctx.sampleRate,len=Math.floor(sr*dur),b=ctx.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++){const k=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-k,decay)*(i<sr*.006?i/(sr*.006):1)}}
  return b;
}
function buildGraph(ctx){
  const g=n=>{const x=ctx.createGain();x.gain.value=n;return x};
  const A={ctx};
  A.out=g(.85);
  A.lim=ctx.createDynamicsCompressor();setP(A.lim,{threshold:-3,knee:0,ratio:20,attack:.002,release:.12});
  A.glue=ctx.createDynamicsCompressor();setP(A.glue,{threshold:-16,knee:10,ratio:2.4,attack:.006,release:.16});
  A.glue.connect(A.lim);A.lim.connect(A.out);A.out.connect(ctx.destination);
  A.musLP=ctx.createBiquadFilter();A.musLP.type='lowpass';A.musLP.frequency.value=20000;A.musLP.Q.value=.9;
  A.mus=g(0);A.musHP=ctx.createBiquadFilter();A.musHP.type='highpass';A.musHP.frequency.value=48;A.musHP.Q.value=.7;
  A.mus.connect(A.musHP);A.musHP.connect(A.musLP);A.musLP.connect(A.glue);
  A.duck=g(1);A.duck.connect(A.mus);A.duck2=g(1);A.duck2.connect(A.mus);
  /* スマホのスピーカーは~200Hz以下が出ない → 低音を歪ませて倍音を作り「聞こえる低音」にする（missing fundamental） */
  const shaper=(drive)=>{const w=ctx.createWaveShaper(),n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(x*drive)/Math.tanh(drive)}w.curve=c;w.oversample='2x';return w};
  A.kickBus=g(1);const ks=shaper(2.2);A.kickBus.connect(ks);ks.connect(A.mus);
  A.bassBus=g(.8);const bs=shaper(3);const bhp=ctx.createBiquadFilter();bhp.type='highpass';bhp.frequency.value=45;A.bassBus.connect(bs);bs.connect(bhp);bhp.connect(A.duck);
  A.sfx=g(1);A.sfx.connect(A.glue);
  A.revIn=g(1);const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=280;
  A.rev=ctx.createConvolver();A.rev.buffer=makeIR(ctx,2.6,2.8);A.revOut=g(.4);
  A.revIn.connect(hp);hp.connect(A.rev);A.rev.connect(A.revOut);A.revOut.connect(A.glue);
  A.dIn=g(1);A.dL=ctx.createDelay(2);A.dR=ctx.createDelay(2);
  const fL=g(.36),fR=g(.36),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3400;
  const mg=ctx.createChannelMerger(2);A.dOut=g(.42);
  A.dIn.connect(lp);lp.connect(A.dL);A.dL.connect(fL);fL.connect(A.dR);A.dR.connect(fR);fR.connect(A.dL);
  A.dL.connect(mg,0,0);A.dR.connect(mg,0,1);mg.connect(A.dOut);A.dOut.connect(A.glue);
  const sr=ctx.sampleRate;A.nb=ctx.createBuffer(1,sr*2,sr);const d=A.nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  A.drone=null;A.rise=null;
  setTempo(A,128);
  return A;
}
function setTempo(A,bpm){const t=60/bpm*.75;A.dL.delayTime.value=t;A.dR.delayTime.value=t}
function V(dest,o={}){
  const c=A.ctx,n=c.createGain();let out=n;
  if(o.pan){const p=c.createStereoPanner();p.pan.value=o.pan;n.connect(p);out=p}
  out.connect(dest);
  if(o.rev){const s=c.createGain();s.gain.value=o.rev;out.connect(s);s.connect(A.revIn)}
  if(o.dly){const s=c.createGain();s.gain.value=o.dly;out.connect(s);s.connect(A.dIn)}
  return n;
}
function O(type,f,t,end,dest){const o=A.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(end+.05);return o}
function ENV(p,t,a,peak,d){p.setValueAtTime(.0001,t);p.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);p.exponentialRampToValueAtTime(.0001,t+a+d)}
function NZ(t,dur,dest,rate=1){const s=A.ctx.createBufferSource();s.buffer=A.nb;s.playbackRate.value=rate;s.connect(dest);s.start(t,Math.random()*1.4);s.stop(t+dur+.02);return s}
function F(type,f,q=1){const b=A.ctx.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b}
const now=()=>AC?AC.currentTime:0;

const S={
  kick(t,v=.9){
    const g=V(A.kickBus);ENV(g.gain,t,.002,v*.4,.2);const o=O('sine',180,t,t+.35,g);o.frequency.exponentialRampToValueAtTime(52,t+.09);
    const bg=V(A.kickBus);ENV(bg.gain,t,.001,v*.42,.08);const ob=O('triangle',260,t,t+.12,bg);ob.frequency.exponentialRampToValueAtTime(110,t+.06);
    const f=F('bandpass',3200,.8),c=V(A.mus);f.connect(c);ENV(c.gain,t,.0006,v*.38,.014);NZ(t,.025,f);
    const dg=A.duck.gain;dg.cancelScheduledValues(t);dg.setTargetAtTime(.2,t,.004);dg.setTargetAtTime(1,t+.035,.07);
    const d2=A.duck2.gain;d2.cancelScheduledValues(t);d2.setTargetAtTime(.6,t,.004);d2.setTargetAtTime(1,t+.03,.05);
    M.beatQ.push(t);
  },
  hat(t,v=.2,open=false){
    const f=F('highpass',6800),g=V(A.mus,{pan:(Math.random()-.5)*.4});f.connect(g);ENV(g.gain,t,.001,v,open?.2:.04);NZ(t,open?.28:.06,f);
    const b=F('bandpass',10500,1.5),g2=V(A.mus);b.connect(g2);ENV(g2.gain,t,.001,v*.8,open?.16:.03);NZ(t,.2,b,1.3);
  },
  shaker(t,v=.08,pan=0){const f=F('bandpass',5500,1.2),g=V(A.mus,{pan});f.connect(g);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.07);NZ(t,.09,f)},
  clap(t,v=.45){
    const f=F('bandpass',1500,1.2),g=V(A.mus,{rev:.35});f.connect(g);const p=g.gain;p.setValueAtTime(.0001,t);
    for(const o of[0,.011,.022]){p.setValueAtTime(v,t+o);p.exponentialRampToValueAtTime(v*.15,t+o+.009)}
    p.setValueAtTime(v,t+.031);p.exponentialRampToValueAtTime(.0001,t+.24);NZ(t,.28,f);
  },
  bass(t,m,dur,v=.4){
    const f=F('lowpass',2400,4),g=V(A.bassBus);f.connect(g);f.frequency.setValueAtTime(2800,t);f.frequency.exponentialRampToValueAtTime(520,t+Math.max(.06,dur*.8));
    ENV(g.gain,t,.004,v,dur);O('sawtooth',mtof(m),t,t+dur+.05,f);O('square',mtof(m+12),t,t+dur+.05,f).detune.value=7;
    const s=V(A.bassBus);ENV(s.gain,t,.004,v*.28,dur);O('sine',mtof(m-12),t,t+dur+.05,s);
  },
  pad(t,notes,dur,v=.06,cut=1500){
    const f=F('lowpass',cut,.7),g=V(A.duck,{rev:.35});f.connect(g);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.06);g.gain.setValueAtTime(v,t+Math.max(.1,dur-.08));g.gain.exponentialRampToValueAtTime(.0001,t+dur+.3);
    for(const m of notes)for(const d of[-11,11]){const o=O('sawtooth',mtof(m),t,t+dur+.35,f);o.detune.value=d}
  },
  pluck(t,m,v=.1,pan=0){
    const f=F('lowpass',5000,4),g=V(A.duck2,{pan,dly:.45,rev:.15});f.connect(g);f.frequency.setValueAtTime(6000,t);f.frequency.exponentialRampToValueAtTime(600,t+.13);
    ENV(g.gain,t,.002,v,.22);O('square',mtof(m),t,t+.26,f);O('triangle',mtof(m+12),t,t+.26,f);
  },
  lead(t,m,dur,v=.07){
    const f=F('lowpass',4600,1),g=V(A.duck2,{dly:.3,rev:.32});f.connect(g);

/* ================= 群衆 ================= */
function drawCrowd(mode,reveal=1,alpha=1){
  const dark=mode!=='wm';ctx.save();ctx.globalAlpha=alpha;
  const bob=CROWD.length<150;
  for(const c of CROWD){
    if(dark&&c.dn>reveal)continue;
    const noticed=dark||G.st==='recog'||G.att/100>c.th;
    const r=c.s*.5;let x=c.x,y=c.y;
    if(dark){x=((x+G.camX)%W+W)%W;y=((y+G.camY)%H+H)%H;if(Math.hypot(x-CX,y-CY)<R*2.6)continue}
    if(bob)y+=Math.sin(G.t*.004+c.ph)*r*.15;
    if(!dark&&G.fever)y-=G.beat*r*(.5+(c.ph%1));
    ctx.fillStyle=dark?'#201b1b':(noticed?'#ec9810':'#f7c843');
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
    const ang=noticed?Math.atan2(CY-y,CX-x):c.look+Math.sin(G.t*.0013+c.ph)*1.5;
    for(const sd of[-1,1]){
      const ex=x+sd*r*.36,ey=y-r*.1;
      if(noticed){const er=r*.27;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,er,0,TAU);ctx.fill();
        ctx.fillStyle=dark?'#ff1030':'#111';ctx.beginPath();ctx.arc(ex+Math.cos(ang)*er*.5,ey+Math.sin(ang)*er*.5,er*.5,0,TAU);ctx.fill()}
      else{ctx.fillStyle='#5a3a00';ctx.beginPath();ctx.arc(ex+Math.cos(ang)*r*.06,ey+Math.sin(ang)*r*.06,r*.1,0,TAU);ctx.fill()}
    }
    if(dark)drawEmo('👆',x+Math.cos(ang)*r*1.25,y+Math.sin(ang)*r*1.25,c.s*.8,ang+PI/2);
  }
  ctx.restore();
}

/* ================= 風車 ================= */
function promptSlots(){
  const p=G.prompt;if(!p)return[];
  if(p.type==='dbl')return p.dirs.map((d,i)=>({d,i})).filter(o=>o.i>=p.idx);
  return[{d:p.dir,i:-1}];
}
function drawWindmill(x,y,r,hide){
  const d=r*2.05,sz=r*1.3,v=Math.abs(G.spinV),ghosts=v>.006?4:v>.003?2:0;
  for(let g=ghosts;g>=0;g--){
    const a0=G.spin-g*G.spinV*9,al=g?.18:1;
    for(let k=0;k<4;k++){
      const a=a0+k*PI/2;
      if(!g&&hide&&hide.some(s=>Math.abs(angDiff(a,s.d*PI/2))<PI/4))continue;
      const br=1+G.beat*.06;drawEmo('👆',x+Math.sin(a)*d,y-Math.cos(a)*d,sz*br,a,al);
    }
  }
}
function chevron(x,y,s,ang,al){
  ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.rotate(ang);ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-s,s*.45);ctx.lineTo(0,-s*.35);ctx.lineTo(s,s*.45);
  ctx.lineWidth=s*.75;ctx.strokeStyle='#000';ctx.stroke();ctx.lineWidth=s*.38;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore();
}
function drawPrompt(){
  const p=G.prompt;if(!p)return;
  const age=G.t-p.t0,k=clamp(age/p.win),ap=eOut(clamp(age/90));
  ctx.lineCap='round';ctx.lineWidth=U*2;ctx.strokeStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(CX,CY,R*1.22,0,TAU);ctx.stroke();
  ctx.strokeStyle=k>.7?'#ff1744':'#fff';ctx.beginPath();ctx.arc(CX,CY,R*1.22,-PI/2,-PI/2+TAU*(1-k));ctx.stroke();
  for(const {d,i} of promptSlots()){
    const sx=CX+DIRS[d][0]*SD,sy=CY+DIRS[d][1]*SD,active=p.type!=='dbl'||i===p.idx;
    const gr=R*(1.15+.1*Math.sin(G.t*.03)),col=p.type==='rev'?'255,30,70':p.type==='dbl'?'80,170,255':'255,255,255';
    const gg=ctx.createRadialGradient(sx,sy,0,sx,sy,gr);gg.addColorStop(0,`rgba(${col},.95)`);gg.addColorStop(.5,`rgba(${col},.6)`);gg.addColorStop(1,`rgba(${col},0)`);
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(sx,sy,gr,0,TAU);ctx.fill();
    const sc=lerp(1.6,1.2,ap)*(active?1:.8);
    if(p.type==='rev'){ctx.fillStyle='#e8002d';ctx.beginPath();ctx.arc(sx,sy,R*.95,0,TAU);ctx.fill();ctx.lineWidth=U*.9;ctx.strokeStyle='#fff';ctx.stroke()}
    if(p.type==='trap')drawEmo('🫵',sx,sy,R*1.25*sc);else drawEmo('👆',sx,sy,R*1.25*sc,d*PI/2,active?1:.55);
    if(p.type==='rev')otext('逆',sx+R*.75,sy-R*.75,U*7.5,'#fff','#e8002d');
    if(p.type==='dbl')otext(String(i+1),sx+R*.75,sy-R*.75,U*7,'#fff','#0050ff');
    if(p.type==='dir'||(p.type==='dbl'&&active))for(let j=0;j<3;j++){
      const ph=(G.t*.0035+j/3)%1,dist=SD+R*.95+ph*R*.75;chevron(CX+DIRS[d][0]*dist,CY+DIRS[d][1]*dist,U*2.4,d*PI/2,(1-ph)*.95);
    }
  }
}

/* ================= 進行 ================= */

}
function startWindmill(){
  G.st='wm';G.att=0;G.crowd=crowdFor(G.round);layoutCrowd();G.wmCount=0;G.prompt=null;G.prev=null;
  rng=mulberry32(baseSeed+G.round*7919+1);
  G.nextPromptAt=G.t+(G.round===1?800:450);musicStart('wm');

}
function wmP(){const r=G.round;return{win:Math.max(360,1000*Math.pow(.84,r-1)),trap:Math.min(.24,.08+.035*(r-1)),rev:r>=3?Math.min(.26,.1+.04*(r-3)):0,dbl:r>=2?Math.min(.22,.08+.035*(r-2)):0,need:12+3*r}}
function newPrompt(){
  const p=wmP(),prev=G.prev;let type='dir';const x=rng();
  if(G.wmCount>=3||G.round>1){
    if(x<p.trap){if(!(prev&&prev.type==='trap'))type='trap'}
    else if(x<p.trap+p.rev)type='rev';
    else if(x<p.trap+p.rev+p.dbl)type='dbl';
  }
  let win=p.win;if(G.round===1&&G.wmCount<3)win=1800;
  if(type==='dbl')win*=1.7;
  if(type!=='dir'&&!SEEN[type]){markSeen(type);win*=2;banner({trap:'🫵 は触るな‼️ 待て',rev:'赤は逆にフリック‼️',dbl:'1→2の順にフリック‼️'}[type],1600)}
  const dir=rng()*4|0;
  G.prompt=G.prev={type,dir,dirs:[dir,(dir+1+(rng()*3|0))%4],idx:0,t0:G.t,win};G.wmCount++;
}
function updWM(){
  if(!G.prompt){if(G.t>=G.nextPromptAt)newPrompt();return}
  if(G.t-G.prompt.t0>G.prompt.win){G.prompt.type==='trap'?wmGood(-1,false):wmBad('遅い‼️')}
}
function wmFlick(d){
  const p=G.prompt;if(!p)return;
  if(p.type==='trap')return wmBad('触った‼️');
  const k=(G.t-p.t0)/p.win;
  if(p.type==='dbl'){
    if(d!==p.dirs[p.idx])return wmBad('ちがう‼️');
    p.idx++;if(p.idx<2){flickFx(d,k<.3);return}
    return wmGood(d,k<.45);
  }
  const want=p.type==='rev'?(p.dir+2)%4:p.dir;
  d===want?wmGood(d,k<(p.type==='rev'?.45:.33)):wmBad('ちがう‼️');

/* フリック1回分の音と絵（コンボ前進） */
function flickFx(d,perfect){
  G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.flicks++;G.comboBump=1;
  if(perfect)G.perfects++;
  const fever=G.fever;G.spinT+=(d===1||d===2?1:-1)*(PI/2+(fever?TAU:0));G.bounce=1;G.lean={d,t:G.t};
  const pan=[0,.55,0,-.55][d];
  snd(t=>{S.bell(t,flickNote(G.combo),perfect?.3:.26,pan,perfect);S.whoosh(t,d,fever?.28:.2)});
  haptic(perfect?15:8);
  const sx=CX+DIRS[d][0]*SD,sy=CY+DIRS[d][1]*SD;
  burst(sx,sy,perfect?18:10,fever?()=>hue(Math.random()*360,65):(perfect?'#fff':'#ffe066'),U*.35);
  if(perfect)pop('PERFECT',CX,CY-R*3.45,U*5.6,'#fff','#ff2d95','j');
  else pop('GOOD',CX,CY-R*3.45,U*4.4,'#fff','#333','j');
  // ゲーム寿命: 10コンボ毎の節目
  if(G.combo%10===0){
    hitstop(55);G.zoom=1;
    pop(G.combo>=30?'ヤバ風車‼️':'見て‼️',CX+(Math.random()<.5?-1:1)*R*1.9,CY-R*2.1,U*8.5,'#fff','#e8002d');
    snd(t=>{const ch=PROG[curBar()][1];S.stab(t,ch.map(m=>m+12),.07);S.crash(t,.18)});haptic([20,30,20]);
  }
  if(!G.fever&&G.combo>=20){G.fever=true;banner('🔥 FEVER 🔥 スコア×2',1300);snd(t=>{S.riser(t,.25,.15);S.crash(t+.25,.3)});G.flash=.6;G.flashCol='#fff'}
  // 最高コンボ記録でスキン解放判定
  checkSkins();
}
function addScore(n,x,y){
  n=Math.round(n);G.score+=n;G.scorePop={n,t:G.t};
  if(!G.bestPassed&&G.best0>0&&G.score>G.best0){G.bestPassed=true;banner('★ 自己ベスト突破 ★',1300);snd(t=>{[72,76,79,84].forEach((m,i)=>S.blip(t+i*.06,m+12,.08,'square',.12))})}
}
function wmGood(d,perfect){

function escP(){return{win:Math.max(330,950*Math.pow(.87,G.round-1))}}

  else if((e.code==='Space'||e.code==='Enter')&&(G.st==='title'||G.st==='result')){e.preventDefault();startRun(G.mode||'endless')}
  else if(G.st==='dead'&&G.cut)showResult();
});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= 描画 ================= */
function draw(){
  ctx.save();
  if(G.shake>0){const s=G.shake*U*2.2;ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s)}
  if(G.zoom>0){const z=1+G.zoom*.05;ctx.translate(CX,CY);ctx.scale(z,z);ctx.translate(-CX,-CY)}
  switch(G.st){
    case 'title':case 'wm':drawWM();break;
    case 'recog':drawRecog();break;
    case 'esc':drawEsc();break;
    case 'shook':drawShook();break;
    case 'dead':drawDead();break;
    case 'result':ctx.fillStyle='#000';ctx.fillRect(-20,-20,W+40,H+40);drawCrowd('esc',1,.3);break;
  }
  for(const p of P){ctx.globalAlpha=clamp(p.life);ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+p.life*4);ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}ctx.globalAlpha=1;
  for(const t of TX){ctx.save();ctx.globalAlpha=clamp(t.life*1.6);ctx.translate(t.x,t.y-(1-t.life)*U*7);ctx.rotate(t.rot);
    const sc=1+Math.max(0,t.life-.85)*3;ctx.scale(sc,sc);otext(t.s,0,0,t.size,t.col,t.stroke);ctx.restore()}
  ctx.restore();
  if(G.st==='wm')hudWM();
  drawBanner();
  if(G.flash>0){ctx.globalAlpha=G.flash*.85;ctx.fillStyle=G.flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
function drawWM(){
  bgPop();drawCrowd('wm');
  vignette(G.st==='wm'?(G.att/100)*.6:0);
  if(G.st==='wm'&&G.att>75){ctx.fillStyle=`rgba(200,0,30,${(.06+.06*Math.sin(G.t*.02))*(G.att-75)/25})`;ctx.fillRect(-20,-20,W+40,H+40)}
  const s=1+.12*G.bounce+G.beat*.03;let fx=CX,fy=CY;
  if(G.lean){const k=clamp((G.t-G.lean.t)/220);const a=Math.sin(PI*k)*R*.18;fx+=DIRS[G.lean.d][0]*a;fy+=DIRS[G.lean.d][1]*a;if(k>=1)G.lean=null}
  if(G.fever){const gg=ctx.createRadialGradient(CX,CY,R*.8,CX,CY,R*3.2);gg.addColorStop(0,'rgba(255,255,255,.55)');gg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(CX,CY,R*3.2,0,TAU);ctx.fill()}
  drawWindmill(CX,CY,R*s,G.st==='wm'?promptSlots():null);
  faceSkin(fx,fy,R*s);
  if(G.st==='wm')drawPrompt();
}
function hudWM(){
  const top=SAFE+U*3+8;
  otext(fmt(G.disp),14,top+U*4,U*7,G.fever?hue(0,70):'#fff','#000','left');
  if(G.scorePop&&G.t-G.scorePop.t<500){const k=(G.t-G.scorePop.t)/500;ctx.globalAlpha=1-k;otext('+'+fmt(G.scorePop.n),14,top+U*10.5-k*U*3,U*4.2,'#ffe066','#000','left');ctx.globalAlpha=1}
  otext('R'+G.round,W-14,top+U*4,U*6,'#fff','#000','right');
  const gx=14,gy=top+U*13,gw=W-28,gh=U*3.4,a=clamp(G.att/100);
  ctx.fillStyle='rgba(0,0,0,.55)';rr(gx,gy,gw,gh,gh/2);ctx.fill();
  const hot=a>.75,blink=hot&&Math.sin(G.t*.03)>0;
  ctx.fillStyle=blink?'#fff':(hot?'#e8002d':'#ff7a1a');rr(gx,gy,Math.max(gh,gw*a),gh,gh/2);ctx.fill();
  ctx.font=`900 ${gh*.72}px ${JP}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.textAlign='right';ctx.fillStyle='#fff';ctx.fillText('注目度',gx+gw-gh*.5,gy+gh/2+1);
  drawEmo('👁️',gx+Math.max(gh,gw*a),gy+gh/2,gh*1.5);
  if(G.combo>=2){
    const s=1+G.comboBump*.4,y=CY+R*3.85;ctx.save();ctx.translate(CX,y);ctx.scale(s,s);
    const col=G.fever?hue(0,62):G.combo>=10?'#ff2d55':'#fff';
    otext(String(G.combo),0,0,U*13,col,'#000');
    const m=(1+Math.floor(G.combo/10))*(G.fever?2:1);
    otext(`COMBO${m>1?'  ×'+m:''}`,0,U*8,U*4.2,'#fff','#000');ctx.restore();
  }
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawRecog(){
  const e=G.t-G.phaseT0;
  if(e<260){
    bgPop();drawCrowd('wm');vignette(.7);
    const z=1+e/260*.1;ctx.save();ctx.translate(CX,CY);ctx.scale(z,z);ctx.translate(-CX,-CY);drawWindmill(CX,CY,R);faceSkin(CX,CY,R);ctx.restore();
    otext('…',CX,CY-R*3,U*10,'#fff','#000');return;
  }
  const k=e-260;bgDark();drawCrowd('esc',clamp(k/600));
  faceDistort(CX+(Math.random()-.5)*R*.06,CY,R,G.t);
  const s=eOut(clamp(k/160)),dist=lerp(R*6,R*2.05,s);
  for(let i=0;i<4;i++)drawEmo('👆',CX+DIRS[i][0]*dist,CY+DIRS[i][1]*dist,R*1.3,i*PI/2+PI);
  const fs=fitSize('まずい“認識”された',W*.9,U*11);
  gtext('まずい“認識”された',CX,CY+R*3.5,fs,'#fff',1.4);
  gtext(`認識者 ${fmt(G.crowd)}人`,CX,SAFE+U*10,U*6,'#ff3550',.6);
  scanlines();
}
function escFingers(){
  const w=G.wave;if(!w)return 0;
  const pre=G.t<w.open,prog=pre?0:clamp((G.t-w.open)/w.win),sz=R*1.3,ap=eOut(clamp((G.t-w.t0)/90));
  for(let k=0;k<4;k++){
    let dist=pre?FAR+Math.sin(G.t*.02+k)*R*.06:lerp(FAR,NEAR,eIn(prog));
    dist=lerp(dist+R*2,dist,ap);
    const jit=R*.03*(1+prog*4),jx=(Math.random()-.5)*jit,jy=(Math.random()-.5)*jit;
    if(k===w.dir){
      if(w.type==='gap')continue;
      if(w.type==='late'&&!pre){const rk=clamp((G.t-w.open)/150);if(rk>=1)continue;const d2=lerp(dist,FAR*2.2,eOut(rk));drawEmo('👆',CX+DIRS[k][0]*d2,CY+DIRS[k][1]*d2,sz,k*PI/2+PI,1-rk);continue}
      if(w.type==='away'){const d2=lerp(FAR+R*2,FAR,ap);drawEmo('👆',CX+DIRS[k][0]*d2+jx,CY+DIRS[k][1]*d2+jy,sz*.95,k*PI/2);continue}
    }
    drawEmo('👆',CX+DIRS[k][0]*dist+jx,CY+DIRS[k][1]*dist+jy,sz,k*PI/2+PI);
  }
  return prog;
}
function drawEsc(){
  let fx=CX,fy=CY;
  if(G.dash){const k=(G.t-G.dash.t0)/210;if(k>=1)G.dash=null;else{
    const d=DIRS[G.dash.dir];fx+=d[0]*Math.sin(PI*k)*R*1.4;fy+=d[1]*Math.sin(PI*k)*R*1.4;
    G.camX-=d[0]*U*2.2;G.camY-=d[1]*U*2.2;}}
  bgDark();drawCrowd('esc',1,.6);
  if(G.dash){const d=DIRS[G.dash.dir];ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=U*.6;ctx.beginPath();
    for(let i=0;i<14;i++){const o=(Math.random()-.5)*Math.max(W,H),L=U*(10+Math.random()*25),sx=Math.random()*W,sy=Math.random()*H;
      if(d[0]){ctx.moveTo(sx,CY+o*.6);ctx.lineTo(sx-d[0]*L,CY+o*.6)}else{ctx.moveTo(CX+o*.6,sy);ctx.lineTo(CX+o*.6,sy-d[1]*L)}}ctx.stroke()}
  const w=G.wave,prog=w&&G.t>=w.open?clamp((G.t-w.open)/w.win):0;
  faceDistort(fx+(Math.random()-.5)*R*.05*(1+prog*3),fy,R,G.t);
  escFingers();
  if(prog>.5)vignette((prog-.5)*1.4*(.7+.3*Math.sin(G.t*.05)),'255,0,40');
  scanlines();
  gtext(`認識者 ${fmt(G.crowd)}人`,CX,SAFE+U*10,U*6,'#ff3550',.5);
  const left=G.waves-G.waveIdx,ty=CY+FAR+R*1.75;
  otext(`逃げろ あと${left}`,CX,ty,U*7,'#fff','#000');
  const dw=U*3.2,tot=G.waves*dw;for(let i=0;i<G.waves;i++){ctx.fillStyle=i<G.waveIdx?'#ff3550':'#444';ctx.beginPath();ctx.arc(CX-tot/2+dw*(i+.5),ty+U*6,dw*.32,0,TAU);ctx.fill()}
}
function drawShook(){
  const e=G.t-G.phaseT0;bgPop();drawCrowd('wm',1,.6);drawWindmill(CX,CY,R);faceSkin(CX,CY,R);
  const s=lerp(2.2,1,eOut(clamp(e/200)));ctx.save();ctx.translate(CX,CY-R*3);ctx.scale(s,s);ctx.rotate(-.06);otext('撒いた‼️',0,0,U*14,'#fff','#e8002d');ctx.restore();
  if(e>200)otext(`+${fmt(G.shookBonus)}`,CX,CY+R*3.3,U*8,'#fff','#000');
  if(e<150){ctx.fillStyle=`rgba(255,255,255,${1-e/150})`;ctx.fillRect(-20,-20,W+40,H+40)}
}
function drawDead(){
  const e=G.t-G.phaseT0;
  if(e<380){
    bgDark();drawCrowd('esc');const k=eIn(clamp(e/240));
    faceDistort(CX,CY,R,G.t,k);
    const dist=lerp(G.deathDist,R*.15,k);for(let i=0;i<4;i++)drawEmo('👆',CX+DIRS[i][0]*dist,CY+DIRS[i][1]*dist,R*1.4*(1+k*.4),i*PI/2+PI);
    scanlines();return;
  }
  ctx.fillStyle='#000';ctx.fillRect(-20,-20,W+40,H+40);
  if(e<CUT){
    const fs=fitSize(NIGE,W*.94,U*14);ctx.font=`900 ${fs}px ${JP}`;const fw=ctx.measureText(NIGE).width;
    gtext(NIGE.slice(0,G.deadN),CX-fw/2,CY,fs,'#fff',1.6,'left');scanlines(.3);
  }
}
function drawBanner(){
  const b=G.banner;if(!b)return;const e=G.t-b.t0;if(e>b.dur){G.banner=null;return}
  const k=eOut(clamp(e/160)),out=clamp((e-b.dur+200)/200),y=SAFE+U*27,h=U*10;
  const dark=G.st!=='wm'&&G.st!=='title';
  ctx.save();ctx.globalAlpha=1-out;ctx.translate((1-k)*-W,0);
  ctx.fillStyle=dark?'#e8002d':'#000';ctx.fillRect(0,y-h/2,W,h);
  const fs=fitSize(b.s,W*.9,U*6.5);ctx.font=`900 ${fs}px ${JP}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=dark?'#fff':'#ffd400';ctx.fillText(b.s,CX,y+1);
  ctx.restore();
}

/* ================= ループ ================= */
let last=performance.now();
function frame(nowMs){
  const dtReal=Math.min(50,nowMs-last);last=nowMs;
  const dt=nowMs<G.hold?0:dtReal;G.t+=dt;
  if(AC)while(M.beatQ.length&&M.beatQ[0]<=AC.currentTime){M.beatQ.shift();G.beat=1}
  G.beat=Math.max(0,G.beat-dtReal*.006);
  G.spinV+=((G.spinT-G.spin)*.0024-G.spinV*.075)*dt;G.spin+=G.spinV*dt;
  if(G.st==='title')G.spinT+=dt*.003;
  G.bounce=Math.max(0,G.bounce-dt*.007);G.comboBump=Math.max(0,G.comboBump-dt*.006);G.zoom=Math.max(0,G.zoom-dtReal*.005);
  G.shake=Math.max(0,G.shake-dtReal*.0035);G.flash=Math.max(0,G.flash-dtReal*.004);
  G.disp+=(G.score-G.disp)*Math.min(1,dtReal*.012);if(Math.abs(G.score-G.disp)<1)G.disp=G.score;
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.0006*dt;p.life-=p.dec*dt;if(p.life<=0)P.splice(i,1)}
  for(let i=TX.length-1;i>=0;i--){TX[i].life-=dt*.0013;if(TX[i].life<=0)TX.splice(i,1)}
  switch(G.st){
    case 'wm':updWM();break;
    case 'recog':updRecog();break;
    case 'esc':updEsc();break;
    case 'shook':if(G.t-G.phaseT0>950){G.round++;checkSkins();startWindmill()}break;
    case 'dead':updDead();break;
  }
  riseUpdate();
  draw();musicTick();requestAnimationFrame(frame);
}

/* ================= リザルト・シェア ================= */
const RANKS=['一般通過風車','目立ちたがり風車','要注意風車','指名手配風車','都市伝説風車','国家認識風車','全人類に認識された','概念風車'];
const rankOf=r=>RANKS[Math.min(r,RANKS.length)-1];
const bestKey=()=>G.mode==='daily'?'nf_daily_'+todayStr():'nf_best';
function checkSkins(){
  const before=SKINS.filter(skinOK).map(s=>s.id);
  if(G.round>LS.get('nf_maxround',1))LS.set('nf_maxround',G.round);
  if(G.maxCombo>LS.get('nf_maxcombo',0))LS.set('nf_maxcombo',G.maxCombo);
  for(const s of SKINS)if(skinOK(s)&&!before.includes(s.id)&&!G.newSkins.includes(s.e)){G.newSkins.push(s.e);if(G.st==='wm')banner(`NEW ${s.e} 解放‼️`,1200)}
}
let countAnim=0;
function showResult(){
  if(G.st==='result')return;G.st='result';
  freshGraph();checkSkins();
  LS.set('nf_total',LS.get('nf_total',0)+G.flicks);LS.set('nf_plays',LS.get('nf_plays',0)+1);
  const old=LS.get(bestKey(),0),isNew=G.score>old;if(isNew)LS.set(bestKey(),G.score);
  $('rNige').textContent='逃げろ'.repeat(Math.min(G.escapes,8))+'逃げ';
  $('rRank').textContent=`【${rankOf(G.round)}】`;
  $('rMode').textContent=G.mode==='daily'?`今日の風車 ${todayStr()}`:'SCORE';
  $('rBest').textContent='';$('rBest').className='rbest';
  $('rNew').textContent=G.newSkins.length?`NEW スキン解放 ${G.newSkins.join(' ')}`:'';
  $('sFlick').textContent=fmt(G.flicks);$('sCombo').textContent=fmt(G.maxCombo);$('sEsc').textContent=fmt(G.escapes);$('sCrowd').textContent=fmt(G.crowd);
  $('rScore').textContent='0';$('result').classList.remove('hidden');
  // スコアのカウントアップ（上昇音つき）
  const target=G.score,dur=900,t0=performance.now();let lastTick=0;cancelAnimationFrame(countAnim);
  const stepFn=()=>{
    const k=clamp((performance.now()-t0)/dur),v=Math.round(target*eOut(k));$('rScore').textContent=fmt(v);
    const ti=Math.floor(k*18);if(ti>lastTick){lastTick=ti;snd(t=>S.blip(t,60+ti*2,.05,'square',.04))}
    if(k<1)countAnim=requestAnimationFrame(stepFn);
    else{
      snd(t=>{S.stab(t,[60,64,67,72],.08);S.bell(t,84,.18,0,true)});
      if(isNew){$('rBest').textContent='★ 自己ベスト更新 ★';$('rBest').className='rbest new';snd(t=>{[72,76,79,84,88,91].forEach((m,i)=>S.bell(t+.12+i*.06,m,.15,(i%2?.4:-.4)));S.crash(t+.12,.2)});haptic([20,30,20,30,40])}
      else $('rBest').textContent=`BEST ${fmt(old)}`;
    }
  };
  stepFn();
}
function shareText(){
  const nige='逃げろ'.repeat(Math.min(G.escapes,10))+'逃げ',f=skinE();
  return `見て‼️認識風車だよ‼️\n　　👆\n　👈${f}👉　${fmt(G.flicks)}回転\n　　👇\n\n　　🫵\n　🫵🫪🫵　認識者${fmt(G.crowd)}人\n　　🫵\n\nまずい“認識”された${nige}\n\n【${rankOf(G.round)}】SCORE ${fmt(G.score)}${G.mode==='daily'?`\n📅今日の風車 ${todayStr()}`:''}\n#認識風車`;
}
const shareURL=()=>/^https?:/.test(location.href)&&!/^https?:\/\/(127\.|localhost|192\.168\.|10\.|100\.)/.test(location.href)?location.href.split('#')[0]:'';
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1700)}
const uiSnd=()=>{audio();snd(t=>{S.blip(t,79,.08,'sine',.06);S.blip(t+.03,86,.05,'sine',.05)})};
$('bPost').onclick=()=>{uiSnd();const u=shareURL();window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText())+(u?'&url='+encodeURIComponent(u):''),'_blank','noopener')};
$('bShare').onclick=async()=>{
  uiSnd();const text=shareText(),u=shareURL();
  if(navigator.share){try{await navigator.share(u?{text,url:u}:{text});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text+(u?'\n'+u:''));toast('コピーした')}catch(e){toast('コピーできなかった')}
};
$('bRetry').onclick=()=>startRun(G.mode);
$('bTop').onclick=()=>{uiSnd();toTitle()};
$('bPlay').onclick=()=>startRun('endless');
$('bDaily').onclick=()=>startRun('daily');
function renderSkins(){
  const box=$('skins');box.innerHTML='';
  for(const s of SKINS){
    const b=document.createElement('button'),ok=skinOK(s);b.className='skin'+(ok?'':' lock')+(s.id===G.skin?' sel':'');b.textContent=ok?s.e:'🔒';
    b.onclick=()=>{uiSnd();if(!ok)return toast(`🔒 ${s.cond}で解放`);G.skin=s.id;LS.set('nf_skin',s.id);renderSkins()};box.appendChild(b);
  }
}
function toTitle(){
  G.st='title';G.att=0;G.crowd=30;G.fever=false;G.combo=0;layoutCrowd();musicStop();
  $('result').classList.add('hidden');$('title').classList.remove('hidden');
  $('dDate').textContent=todayStr();renderSkins();
  const b=LS.get('nf_best',0),d=LS.get('nf_daily_'+todayStr(),0),tot=LS.get('nf_total',0);
  $('best').textContent=[b?`BEST ${fmt(b)}`:'',d?`今日 ${fmt(d)}`:'',tot?`累計 ${fmt(tot)}回転`:''].filter(Boolean).join('　');
}

/* ================= 起動 ================= */
addEventListener('resize',resize);
['👆','🫵','👁️',...SKINS.map(s=>s.e)].forEach(spr);
resize();toTitle();requestAnimationFrame(frame);
</script>
